<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quiz Trainer - Results</title>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/fonts/PTSans/stylesheet.css" />
  </head>

  <body style="flex-wrap: wrap">
    <section class="plate visible" data-card="6">
      <div class="cover-content-wrapper">
        <div class="cover-content">
          <section>
            <img
              class="title-img"
              width="70"
              src="img/icons/clapping.svg"
              alt="Спасибо!"
            />
            <div class="title">Thank you!</div>
            <p>
              Your quiz results and course materials have already been sent to
              your email.
            </p>
          </section>

          <section>
            <div class="title-2">Your bonuses:</div>
            <div class="bonus-cards-wrapper">
              <a href="#" target="_blank" class="bonus-card">
                <img
                  class="bonus-card__img"
                  src="img/icons/leaflet.svg"
                  alt=""
                />
                <div class="bonus-card__title">Course Study Guide</div>
              </a>
              <a href="#" target="_blank" class="bonus-card">
                <img
                  class="bonus-card__img"
                  src="img/icons/video-tutorial.png"
                  alt=""
                />
                <div class="bonus-card__title">Course Video Tutorial</div>
              </a>
            </div>
          </section>
        </div>
      </div>
    </section>
  </body>
</html>
